name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/immich-share

jobs:
  # ── Build each platform natively (avoids QEMU timeout with native modules) ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    outputs:
      # Export the digest from each matrix leg so the merge job can consume them
      # without needing artifact downloads for the key lookup.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Sanitise once — reuse the output in both cache keys and artifact names.
      - name: Sanitise platform name
        id: platform
        run: echo "key=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Separate cache scopes per platform so arm64 and amd64 layers never
          # evict each other from the shared GHA cache.
          cache-from: type=gha,scope=build-${{ steps.platform.outputs.key }}
          cache-to:   type=gha,mode=max,scope=build-${{ steps.platform.outputs.key }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-platform digests into a single multi-arch manifest ──────────
  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect final image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # ── Delete all tags on DockerHub that are not part of this release ─────────
  cleanup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: read

    steps:
      - name: Delete old DockerHub tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/immich-share
        run: |
          set -euo pipefail

          # Authenticate with DockerHub and get a JWT.
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" \
            | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::DockerHub authentication failed."
            exit 1
          fi

          # Fetch all current tags (paginate — DockerHub returns max 100 per page).
          ALL_TAGS=()
          NEXT="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          while [ "$NEXT" != "null" ] && [ -n "$NEXT" ]; do
            PAGE=$(curl -s -H "Authorization: Bearer ${TOKEN}" "$NEXT")
            mapfile -t PAGE_TAGS < <(echo "$PAGE" | jq -r '.results[].name')
            ALL_TAGS+=("${PAGE_TAGS[@]}")
            NEXT=$(echo "$PAGE" | jq -r '.next // "null"')
          done

          echo "Found ${#ALL_TAGS[@]} tag(s) total."

          # Tags to KEEP: latest + any semver-style tags (v1.2.3, 1.2, 1, sha-*).
          # Adjust this pattern if your tag scheme differs.
          KEEP_PATTERN='^(latest|v?[0-9]+(\.[0-9]+){0,2}|sha-.+)$'

          DELETED=0
          for TAG in "${ALL_TAGS[@]}"; do
            if echo "$TAG" | grep -qE "$KEEP_PATTERN"; then
              echo "  KEEP  $TAG"
            else
              echo "  DELETE $TAG"
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" \
                -H "Authorization: Bearer ${TOKEN}")
              if [ "$HTTP" = "204" ]; then
                DELETED=$((DELETED + 1))
              else
                echo "::warning::Failed to delete tag '${TAG}' (HTTP ${HTTP})"
              fi
            fi
          done

          echo "Done — deleted ${DELETED} tag(s)."

  # ── Update Docker Hub readme ───────────────────────────────────────────────
  update-description:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: merge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
