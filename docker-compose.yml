services:
  immich-share:
    image: samuelstreets/immich-share:latest
    # Or build locally:
    # build: .
    container_name: immich-share
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - immich-share-data:/app/data
    environment:
      NODE_ENV: production

      # ── Required ────────────────────────────────────────────────────────────
      # Required: set in your shell or a .env file next to this file.
      # Generate with: openssl rand -hex 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random string of 32+ chars}

      # ── Optional ────────────────────────────────────────────────────────────
      # Initial admin password (first run only, min 8 chars). If unset, a random
      # one is generated and printed once in the container logs.
      # ADMIN_PASSWORD: choose-a-strong-password

      # Allow webhooks to target private/LAN addresses (blocked by default)
      # ALLOW_PRIVATE_WEBHOOKS: "true"

      PORT: 3000
      DB_PATH: /app/data/app.db

      # ── Legacy first-boot seeding (optional) ────────────────────────────────
      # Set these to pre-populate the Settings UI on first boot only.
      # After first boot, configure everything via Admin → Settings.
      # IMMICH_URL: http://192.168.1.100:2283
      # IMMICH_API_KEY: your-api-key-here
      # EXTERNAL_URL: https://share.yourdomain.com

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/info/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  immich-share-data:
    driver: local